# Corre los tests automáticamente en GitHub.
# Se ejecuta en cada PR y en cada push a main, así nada entra a main sin
# que los tests hayan pasado.

name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    # Se prueba en Windows (donde se desarrolla) y en Linux (donde
    # normalmente se publica una app web).
    strategy:
      matrix:
        sistema: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.sistema }}

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr los tests
        run: python -m pytest

  # Tests del JavaScript del frontend que es lógica pura (app/static/compartir.js).
  # Usan el runner que trae Node, sin instalar paquetes. Alcanza con Linux:
  # ese código no depende del sistema operativo.
  node-test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v5

      - name: Instalar Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Correr los tests de JavaScript
        run: node --test "tests/js/*.test.mjs"
