<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Correlativas</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Planificador de Correlativas</h1>
        <p class="carrera">Tecnicatura Universitaria en Programación · Plan 2024</p>
        <p class="ayuda">Marcá qué materias tenés regulares o aprobadas. Tu progreso se guarda en este navegador.</p>
    </header>

    <!-- aria-live hace que los lectores de pantalla anuncien los cambios del resumen. -->
    <section id="resumen" aria-live="polite"></section>

    <ul class="leyenda" aria-label="Qué significa cada color">
        <li class="cursable">Podés cursarla</li>
        <li class="rendible">Podés rendirla</li>
        <li class="bloqueada">Bloqueada</li>
        <li class="aprobada">Aprobada</li>
    </ul>

    <main id="plan">
        <p class="mensaje">Cargando el plan…</p>
    </main>

    <!-- `defer` ejecuta el script cuando el HTML ya está armado. -->
    <script src="app.js" defer></script>
</body>
</html>
